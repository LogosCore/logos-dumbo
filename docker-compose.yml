# Local development stack for logos-dumbo: the channel and the factory from
# one image, and dumbo-www, a PHP web server for trying pages. Joins
# logos-core's network to reach core and its RabbitMQ. Start logos-core
# first, then:
#
#   docker compose up -d --build
#
# Put a page Dumbo built in ./www and add a target for it with the URL
# http://dumbo-www/<page>.php (the channel reaches it on the logos network).
services:
  dumbo-channel:
    build:
      context: .
      args:
        VERSION: dev
    image: logos-dumbo:dev
    container_name: logos-dumbo-channel
    restart: unless-stopped
    # Above CALL_TIMEOUT + 5s: calls in progress finish, then it deregisters.
    stop_grace_period: 40s
    environment:
      CHANNEL_ID: ${CHANNEL_ID:-dumbo-local}
      LOGOS_CORE_BASE_URL: ${LOGOS_CORE_BASE_URL:-http://logos-core-dev:8002}
      CALL_TIMEOUT: ${CALL_TIMEOUT:-30s}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-logos-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-logos}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    networks:
      - logos

  dumbo-factory:
    image: logos-dumbo:dev
    container_name: logos-dumbo-factory
    entrypoint: ["/app/dumbo-factory"]
    depends_on:
      - dumbo-channel
    restart: unless-stopped
    environment:
      FACTORY_ID: ${FACTORY_ID:-dumbo-factory-local}
      # Builds fetch their files from core and upload the artifact to it.
      LOGOS_CORE_BASE_URL: ${LOGOS_CORE_BASE_URL:-http://logos-core-dev:8002}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-logos-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-logos}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    networks:
      - logos

  dumbo-www:
    image: php:8.3-apache
    container_name: logos-dumbo-www
    restart: unless-stopped
    volumes:
      - ./www:/var/www/html
    ports:
      - "${DUMBO_WWW_PORT:-8095}:80"
    networks:
      - logos

networks:
  logos:
    external: true
    name: logos-core_logos
